name: Property Details regression

on:
  pull_request:
  push:
    branches:
      - feature/property-portfolio-table-view

permissions:
  contents: read

jobs:
  details-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install composer dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Details and registry compatibility regression tests
        run: python -m unittest discover -s tests -v
